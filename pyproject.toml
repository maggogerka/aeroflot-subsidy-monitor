[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroflot-subsidy-monitor"
version = "1.0.0"
description = "Configurable local monitor for Aeroflot subsidized tickets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "aeroflot-subsidy-monitor contributors" }]
keywords = ["aeroflot", "playwright", "telegram", "monitoring", "tickets"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "playwright>=1.50,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10"]

[project.scripts]
aeroflot-checker = "app.main:cli"
aeroflot-checker-configure = "app.configure:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
